name: Terraform modules release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"

jobs:
  http-proxy-configurator-terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1  # main
    permissions:
      contents: write
    with:
      tag-prefix: http-proxy-configurator-tf-
      major-version-file: terraform/charm/http_proxy_configurator/MAJOR_VERSION
  http-proxy-policy-terraform:
    needs: http-proxy-configurator-terraform
    if: ${{ !cancelled() }}
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1  # main
    permissions:
      contents: write
    with:
      tag-prefix: http-proxy-policy-tf-
      major-version-file: terraform/charm/http_proxy_policy/MAJOR_VERSION
  squid-forward-proxy-terraform:
    needs: http-proxy-policy-terraform
    if: ${{ !cancelled() }}
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1  # main
    permissions:
      contents: write
    with:
      tag-prefix: squid-forward-proxy-tf-
      major-version-file: terraform/charm/squid_forward_proxy/MAJOR_VERSION
